[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salva-backend"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
