[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salva-backend"
version = "1.0.0"
description = "SALVA REST API: lots, risk analysis, decision simulation, recommendation and explanation"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "salva-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "cryptography>=47",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.0"]
lgbm = ["salva-core[lgbm]"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:httpx.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "BLE", "S"]
# B008: FastAPI's Depends()/Query() in default arguments is the framework's documented pattern.
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108"]
"migrations/**" = ["E501"]
