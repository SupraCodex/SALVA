# Local run of the whole product: PostgreSQL + API + web interface on http://localhost:8000
#   cp .env.example .env    (then set JWT_SECRET)
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: salva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salva}
      POSTGRES_DB: salva
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salva"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://salva:${POSTGRES_PASSWORD:-salva}@db:5432/salva
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
