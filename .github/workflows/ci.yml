name: ci

on:
  push:
    branches: [main, "release/**", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (science)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e "core[dev,lgbm]"
      - run: ruff format --check core && ruff check core
      - run: mypy core/salva_core --ignore-missing-imports
      - run: >-
          python -m pytest core/tests -q --cov=salva_core --cov-report=term-missing
          --cov-report=json:/tmp/core-coverage-current.json --cov-fail-under=70
      - name: Coverage must not decrease on a pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          mkdir -p /tmp/base && git archive "origin/$BASE_REF" | tar -x -C /tmp/base
          if [ -f /tmp/base/core/pyproject.toml ]; then
            python -m venv /tmp/base-venv
            /tmp/base-venv/bin/python -m pip install -q -e "/tmp/base/core[dev,lgbm]"
            (cd /tmp/base && /tmp/base-venv/bin/python -m pytest core/tests -q \
              --cov=salva_core --cov-report=json:/tmp/core-coverage-base.json) || true
            if [ -f /tmp/core-coverage-base.json ]; then
              python core/scripts/check_coverage_regression.py /tmp/core-coverage-current.json /tmp/core-coverage-base.json
            fi
          fi

  ml:
    name: ml pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e core -r ml/requirements.txt
      - run: ruff check ml
      - run: python -m pytest ml/tests -q

  backend:
    name: backend (API + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salva
          POSTGRES_PASSWORD: salva
          POSTGRES_DB: salva_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salva" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://salva:salva@localhost:5432/salva_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e core -e "backend[dev]"
      - working-directory: backend
        run: ruff format --check . && ruff check .
      - working-directory: backend
        run: mypy app
      - working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60

  frontend:
    name: frontend (types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end (browser)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salva
          POSTGRES_PASSWORD: salva
          POSTGRES_DB: salva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salva" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://salva:salva@localhost:5432/salva
      WEATHER_ENABLED: "false"
      SALVA_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
      - run: python -m pip install --upgrade pip && python -m pip install -e core -e backend -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - working-directory: backend
        run: alembic upgrade head && python -m app.seed --reference
      - working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
      - run: python -m pytest e2e -q
      - if: failure()
        run: cat /tmp/uvicorn.log

  security:
    name: secrets and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the history for secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools pip-audit && python -m pip install -e core -e backend
      - name: Audit Python dependencies (pip-audit)
        run: |
          status=0
          pip-audit --skip-editable --desc -f json -o /tmp/audit.json || status=$?
          python - <<'PY'
          import json
          data = json.load(open("/tmp/audit.json"))
          for dep in data.get("dependencies", []):
              for v in dep.get("vulns", []):
                  fixes = ", ".join(v.get("fix_versions", [])) or "none"
                  print(f"::error title=Vulnerable dependency::{dep['name']} {dep['version']} {v['id']} (fixed in: {fixes})")
          PY
          exit $status
