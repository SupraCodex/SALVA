name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install pytest ruff pydantic pydantic-settings httpx
          for d in core backend; do
            if [ -f "$d/pyproject.toml" ]; then pip install -e "$d"; fi
          done
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          PYTHONPATH: backend
        run: pytest -q || [ $? -eq 5 ]
