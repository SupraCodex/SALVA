name: core

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    paths:
      - "core/**"
      - "data/reference/products.yaml"
      - ".github/workflows/core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e "core[dev]"
      - name: Compile Python sources
        run: python -m compileall -q core/salva_core core/tests
      - name: Check formatting and lint
        run: ruff format --check core && ruff check core
      - name: Check types
        run: mypy core/salva_core --ignore-missing-imports
      - name: Run tests
        run: python -m pytest core/tests -q --cov=salva_core --cov-report=term-missing --cov-report=json:/tmp/core-coverage-current.json --cov-fail-under=70
      - name: Compare coverage to pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git cat-file -e "origin/$BASE_REF:core/pyproject.toml" 2>/dev/null; then
            mkdir -p /tmp/salva-core-base
            git archive "origin/$BASE_REF" | tar -x -C /tmp/salva-core-base
            python -m venv /tmp/salva-core-base-venv
            /tmp/salva-core-base-venv/bin/python -m pip install -e "/tmp/salva-core-base/core[dev]"
            (
              cd /tmp/salva-core-base
              /tmp/salva-core-base-venv/bin/python -m pytest core/tests -q \
                --cov=salva_core --cov-report=json:/tmp/core-coverage-base.json \
                --cov-fail-under=70
            )
            python core/scripts/check_coverage_regression.py \
              /tmp/core-coverage-current.json /tmp/core-coverage-base.json
          else
            echo "Base branch has no core package yet; the 70% coverage gate establishes its initial baseline."
          fi
