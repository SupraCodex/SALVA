# Product reference parameters for the SALVA kinetic model (owner: P3).
#
# EVERY value below is a STARTING POINT to be calibrated, NOT an experimental result.
# Each parameter carries: value, unit, description, source, note.
#   source: literature | interview | assumption
#   - 'literature' REQUIRES a non-empty 'reference' field (a verified citation).
#   - No literature citation has been verified yet, so every source is 'assumption'.
#     Do NOT change a source to 'literature' without adding the real reference.
# core/salva_core/params.py validates this structure and refuses incomplete entries.
schema_version: 1

tomato:
  label: {fr: Tomate, en: Tomato}
  source_note: >
    All parameters are assumptions pending calibration against the literature and
    field interviews (see docs/p3-ml-kinetics.md, section Calibration).
  parameters:
    t_ref_c:
      value: 20.0
      unit: degC
      description: Reference temperature at which k_ref is defined.
      source: assumption
      note: Convention only.
    k_ref:
      value: 0.003
      unit: 1/h
      description: >
        Mean quality decay rate at t_ref_c for the 'breaker' maturity stage
        (Q = exp(-k*hours)). 0.003 gives Q ~ 0.60 after 168 h at 20 degC.
      source: assumption
      note: Order of magnitude chosen to be plausible, not measured. Calibrate first.
    q10:
      value: 2.2
      unit: dimensionless
      description: Factor by which the decay rate is multiplied per +10 degC.
      source: assumption
      note: Typical biological Q10 values are around 2-3; verify for tomato.
    sigma_h:
      value: 0.15
      unit: dimensionless (log-scale std)
      description: >
        Fruit-to-fruit heterogeneity: individual fruit quality is
        q_i = Q * exp(sigma_h * eps), eps ~ N(0,1).
      source: assumption
      note: >
        Also fixes the baseline grading loss of fresh produce (about 3% at Q=1).
    sigma_lot:
      value: 0.25
      unit: dimensionless (log-scale std)
      description: >
        Lot-to-lot variability of the decay rate: k_lot = exp(sigma_lot * z),
        z ~ N(0,1) (z = ndtri(u) in the code).
      source: assumption
      note: Drives the P10-P90 spread. Calibrate with observed lot outcomes.
    delta:
      value: 0.5
      unit: dimensionless
      description: >
        Price factor applied to quantity exceeding market absorption (used by the
        simulation engine of P1, kept here as the single product reference file).
      source: assumption
      note: Not used by kinetics.py.
    default_diurnal_amp_c:
      value: 5.0
      unit: degC
      description: >
        Default half-amplitude of the daily temperature cycle (temp_max_c - temp_mean_c)
        when the caller provides no maximum temperature.
      source: assumption
      note: Replace by weather-API derived value when available.
    shelf_life_loss_threshold:
      value: 0.25
      unit: fraction of commercial value lost
      description: Loss fraction at which the remaining shelf-life estimate is exhausted.
      source: assumption
      note: Business threshold pending field validation; not a scientific constant.
    maturity:
      value: {green: 0.6, breaker: 1.0, ripe: 2.0}
      unit: dimensionless multiplier on k
      description: Maturity stage multiplier m_mat on the decay rate.
      source: assumption
      note: Ordering green < breaker < ripe is required (validated); values uncalibrated.
    pack_delta_c:
      value: {crate: 0.0, carton: 1.5, sack: 2.5}
      unit: degC
      description: >
        Extra product temperature versus air caused by packaging (heat retention,
        poor ventilation).
      source: assumption
      note: To validate with transporters.
    pack_damage:
      value: {crate: 0.02, carton: 0.04, sack: 0.08}
      unit: fraction of value
      description: >
        Immediate value loss from crushing/handling damage, applied multiplicatively
        to the value fraction.
      source: assumption
      note: To validate with market actors.
    storage_temp_offset_c:
      value: {none: 0.0, ambient_shade: -2.0, ventilated: -1.0, cold_room: -12.0}
      unit: degC
      description: >
        Temperature offset versus transport conditions when the lot is held in a
        storage site of this type. 'none' = no storage.
      source: assumption
      note: >
        The core applies a separate maturity-aware chilling penalty below configured
        thresholds. This offset remains an uncalibrated site assumption; measured product
        temperature is needed before interpreting cold-room scenarios operationally.
    chilling_threshold_c:
      value: {green: 10.0, breaker: 10.0, ripe: 7.0}
      unit: degC
      description: Stage-specific lower temperature boundary used to accumulate cold exposure.
      source: literature
      reference: https://postharvest.ucdavis.edu/produce-facts-sheets/tomato
      note: >
        10 C is the documented chilling-sensitive boundary for green tomatoes; 7 C is
        the lower recommended short-term storage bound for firm-ripe tomatoes. These
        operating thresholds are not universal cultivar-specific injury cutoffs.
    chilling_onset_equivalent_h:
      value: {green: 336.0, breaker: 336.0, ripe: 120.0}
      unit: equivalent hours at the maturity-specific threshold
      description: Initial cumulative cold-dose allowance before the value penalty starts.
      source: assumption
      note: >
        Green/breaker 336 h corresponds to the 14-day mature-green storage observation;
        ripe 120 h is the upper 5-day end of the firm-ripe short-term window. The breaker
        value is a conservative proxy; calibrate by cultivar and maturity data.
    chilling_temperature_scale_c:
      value: 7.2
      unit: degC
      description: Temperature scale for converting colder exposure into equivalent cold hours.
      source: assumption
      note: >
        Initial value maps approximately 7 days at 5 C to 14 days at 10 C, as reported
        in the UC Davis handling guidance; it is a dose model assumption, not a fitted law.
    chilling_loss_rate_per_equivalent_h:
      value: 0.00015
      unit: 1 / equivalent h
      description: Post-onset exponential fraction-of-value hazard for accumulated chilling dose.
      source: assumption
      note: >
        Illustrative penalty intensity only. The cited sources do not supply a universal
        FCFA/value-loss conversion; calibrate with local cultivar, grade and outcome data.
    risk_thresholds:
      value: {low_p50_max: 0.10, medium_p50_max: 0.25, low_width_max: 0.20, medium_width_max: 0.35}
      unit: loss-fraction thresholds
      description: Product-specific thresholds combining median loss and P10-P90 uncertainty width.
      source: assumption
      note: Starting business rules pending calibration with field users and outcomes.
    grades:
      value: [[0.80, 1.0], [0.60, 0.6], [0.40, 0.3]]
      unit: "[quality threshold in (0,1), price multiplier in [0,1]]"
      description: >
        Grade A if q >= 0.80 (price x1.0), B if q >= 0.60 (x0.6), C if q >= 0.40
        (x0.3), D below (x0, lost). Thresholds strictly decreasing.
      source: assumption
      note: Business convention to validate with market actors, not a scientific law.
  valid_ranges:
    temp_mean_c: {min: 0.0, max: 50.0, unit: degC}
    age_h: {min: 0.0, max: 720.0, unit: h}
    remaining_transit_h: {min: 0.0, max: 720.0, unit: h}
    hold_h: {min: 0.0, max: 72.0, unit: h}
  # Initial synthetic-training support derived from SALVA_Document_de_Conception.docx §28
  # (18–38 C air, packaging/storage offsets, age 0–168 h, transit 0–72 h, storage hold 0–72 h).
  # These are planning assumptions, NOT learned or field-calibrated ranges. A packaged model
  # must publish its actual feature ranges and they take precedence at model registration.
  calibration_ranges:
    temp_mean_c: {min: 6.0, max: 40.5, unit: degC}
    temp_max_c: {min: 10.0, max: 50.5, unit: degC}
    degree_hours_above_ref: {min: 0.0, max: 6396.0, unit: degC*h}
    age_h: {min: 0.0, max: 168.0, unit: h}
    remaining_transit_h: {min: 0.0, max: 144.0, unit: h}
    delay_h: {min: 0.0, max: 48.0, unit: h}
    hold_h: {min: 0.0, max: 72.0, unit: h}
    exposure_h: {min: 0.0, max: 312.0, unit: h}
